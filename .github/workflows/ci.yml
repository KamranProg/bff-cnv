name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          version: 9.8.0
          run_install: false

      # This enables task distribution via Nx Cloud
      # Run this command as early as possible, before dependencies are installed
      # Learn more at https://nx.dev/ci/reference/nx-cloud-cli#npx-nxcloud-startcirun
      # Uncomment this line to enable task distribution
      # - run: pnpm dlx nx start-ci-run --distribute-on="3 linux-medium-js" --stop-agents-after="e2e-ci"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps

      # ---- Checks in the right order (fastest first) ----

      - name: Format check
        run: pnpm nx format:check

      - name: Lint (all projects)
        run: pnpm nx run-many -t lint --all

      - name: Typecheck (all projects)
        run: pnpm nx run-many -t typecheck --all

      - name: Unit Tests (CI configuration)
        run: pnpm nx run-many -t test --all --configuration=ci

      - name: Build (all apps/libs)
        run: pnpm nx run-many -t build --all

      # Optional: E2E (after build)
      - name: E2E
        run: pnpm nx run-many -t e2e --all

      # Nx Cloud self-healing (optional)
      - run: pnpm exec nx fix-ci
        if: always()
